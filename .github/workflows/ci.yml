name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # The extension bundle is committed because Marketplace installs it
      # straight from the repository — fail if someone forgot to rebuild it.
      - name: Check committed bundle is current
        run: git diff --exit-code projects/label-link/dist/label-catalog.js
